# Typora 0.11.18（免费版）AppImage 配方
#
# 用法：
#   x86_64:  ./pkg2appimage-*.AppImage Typora.yml
#   arm64:   ARCH=aarch64 ./pkg2appimage-*.AppImage Typora.yml
#
# 产物：out/Typora-0.11.18.glibc2.X-<arch>.AppImage
#
# 说明：
#   - 该 .deb 不声明任何依赖（Depends 为空），且是 Electron 13 应用，
#     所需的系统库（GTK3 / NSS / ALSA 等）由运行 AppImage 的主机提供，
#     因此无需 ingredients.dist / apt 拉取依赖。
#   - Electron 的 SUID 沙箱在 AppImage 中无法工作（FUSE 挂载通常为
#     nosuid），所以自定义 AppRun 以 --no-sandbox 启动，这是
#     Chromium/Electron 类 AppImage 的通行做法。
#   - Electron 二进制按自身路径解析 resources/、locales/ 等资源，
#     不需要 binpatch: true。

app: Typora

ingredients:
  # 下载与目标架构匹配的 deb（amd64 / arm64）。
  # 通过 ARCH 环境变量指定目标架构（见上方用法），未设置时按本机架构。
  script:
    - case "${ARCH:-$(uname -m)}" in x86_64|amd64) DARCH="amd64" ;; aarch64|arm64) DARCH="arm64" ;; *) echo "Unsupported architecture: ${ARCH:-$(uname -m)}" >&2; exit 1 ;; esac; wget -c "https://github.com/wyf9661/typora-free/releases/download/v0.11.18/typora_0.11.18_${DARCH}.deb"

script:
  # 覆盖 pkg2appimage 下载的默认 AppRun，用 --no-sandbox 启动 Typora。
  # 二进制位于 usr/share/typora/Typora（由 deb 解包得到）。
  # 输入法：不在此设置任何 GTK_IM_MODULE / XMODIFIERS 等变量——会话环境
  # 中有则自然继承（ibus/fcitx 用户各得其所），没有则交给 GTK 默认行为
  # 或仓库内的 setup-input-method.sh 写入的 ~/.config/gtk-3.0/settings.ini
  # （gtk-im-module=fcitx|ibus，GTK3 在 X11/XWayland 下始终读取）。
  # 实测 Typora 0.11.18 (Electron 13) 启动时会丢弃 AppRun export 的变量，
  # 因此环境变量方案本就无效，这里不做任何输入法假设。
  - cat > ./AppRun <<\EOF
  - #!/bin/sh
  - # 不需要设置 LD_LIBRARY_PATH：Typora 的私有库（libffmpeg.so 等）与
  - # 二进制同目录（usr/share/typora/），Electron 按自身路径加载；
  - # 系统库（GTK3/NSS）由宿主 ldconfig 提供。
  - HERE="$(dirname "$(readlink -f "${0}")")"
  - exec "${HERE}"/usr/share/typora/Typora --no-sandbox "$@"
  - EOF
  - chmod a+x ./AppRun
